[project]
name = "kuba-engine"
version = "0.1.0"
description = "Headless folktale video generation pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2"
]
real = [
  "kokoro-onnx>=0.3.4",
  "numpy>=1.26"
]

[project.scripts]
kuba = "kuba.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
